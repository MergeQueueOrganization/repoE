on:
  workflow_dispatch: {}
  pull_request: {}
  merge_group: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    # Random HH:MM to avoid a load spike at 00:00
    - cron: "42 23 * * *"

name: Semgrep

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    container:
      image: semgrep/semgrep

    # Skip PRs created by Dependabot, but allow merge-group events
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    
      - name: Configure merge-group diff scan
        if: github.event_name == 'merge_group'
        shell: sh
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
    
          BASELINE_COMMIT="$(git merge-base HEAD refs/remotes/origin/main)"
    
          echo "Merge-group commit: $(git rev-parse HEAD)"
          echo "Baseline commit: ${BASELINE_COMMIT}"
    
          echo "SEMGREP_BASELINE_REF=${BASELINE_COMMIT}" >> "$GITHUB_ENV"
    
      - name: Run Semgrep
        run: semgrep ci
