on:
  workflow_dispatch: {}
  pull_request: {}
  merge_group: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    - cron: "42 23 * * *"

name: Semgrep

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    container:
      image: semgrep/semgrep

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required so git merge-base can reliably find the common ancestor.
          fetch-depth: 0

      - name: Configure merge-group diff scan
        if: github.event_name == 'merge_group'
        shell: sh
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main

          BASELINE_COMMIT="$(git merge-base HEAD refs/remotes/origin/main)"

          echo "Merge-group commit: $(git rev-parse HEAD)"
          echo "Baseline commit: ${BASELINE_COMMIT}"

          echo "SEMGREP_BASELINE_REF=${BASELINE_COMMIT}" >> "$GITHUB_ENV"

      - name: Run Semgrep
        run: semgrep ci
